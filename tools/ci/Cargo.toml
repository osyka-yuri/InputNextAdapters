[package]
name = "inputnext-adapters-ci"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Build and qualification tooling for InputNextAdapters"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dunce = "1.0.5"
flate2 = "1.1.11"
lzma-rust2 = "0.25.0"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "process-group"] }
quick-xml = "0.42.0"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
walkdir = "2.5.0"
zip = { version = "9.4.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[lints]
workspace = true
