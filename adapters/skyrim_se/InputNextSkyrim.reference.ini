; InputNext Skyrim: complete settings reference.
; This file is not loaded by the adapter.
; Edit the global controls in InputNextSkyrim.ini first.
; For individual effects, copy only the desired profile sections below into InputNextSkyrim.ini.
; Each profile section may appear only once. Include only the keys you want to change.
; Omitted keys use built-in defaults; this reference lists their neutral values.
; HD/classic strength and timing changes affect the built-in effect rather than replacing its recipe.
; Restart Skyrim after edits. Use true/false for switches and a dot for decimals.
; Invalid settings reject the working file; the startup log identifies the line and reason.
; Keep section and key names as written.
; default keeps the built-in setting for FrequencyHz, ResistanceStart and VibrationFrequencyCode.

[InputNextSkyrim]
ControllerSlot=0            ; Controller slot: 0..3. Normally 0 with one controller.
TriggerScale=1.0            ; Overall trigger strength: 0..1 (0=off, 1=built-in strength).
RumbleScale=1.0             ; Overall body strength, HD and classic: 0..1 (0=off, 1=built-in strength).
BodyEnabled=true            ; Body effects in the controller grips.
AudioHapticsEnabled=true    ; Compiled stock audio profiles and optional bank overrides; false uses synthetic effects.
TriggersEnabled=true        ; Adaptive-trigger effects, independent of body effects.
RespectGameVibration=true   ; Follow Skyrim's Vibration option for body effects; triggers stay independent.

; LED feedback is independent of body/trigger settings and game vibration preference.
; Any current HP change, including regen or environmental damage, holds the current HP color.
; Repeated HP changes keep it visible without a maximum total duration. Critical HP only raises
; the priority of an active timed health indication. Detection endpoints are raw authored scores.
[LED]
Enabled=true
HealthEnabled=true
StealthEnabled=true
HealthHoldMs=4000
HealingTransitionMs=200
CriticalEnter=0.20
CriticalExit=0.25
DetectionHiddenScore=0
DetectionAlertScore=100

; Body profiles affect the controller grips, not adaptive triggers.
; Enabled=false disables this body profile in both HD and classic modes.
; HDScale: HD strength multiplier, 0..2. ClassicScale: classic fallback strength multiplier, 0..2.
; Classic fallback is generated by this adapter; ClassicScale does not rescale Skyrim's original vibration.
; HD is preferred when available; classic is the fallback. Only one body mode plays at a time.
; Scale examples: 1.0=normal, 0.5=half, 2.0=twice. Final output limits still apply.
; A scale of 0 silences that mode; it does not force the other mode. Profiles without ClassicScale are HD-only.
; DurationScale: 0.25..2, for short effects only. It stretches the whole effect, including pauses between pulses.
; FrequencyHz=default keeps this profile's built-in HD frequency.
; FrequencyHz=20..1000 overrides the HD tone in Hz; classic output and pulse timing stay unchanged.
; Sustained profiles omit DurationScale because their duration follows the game action.

