; Adaptive triggers: resistance and trigger-local vibration, separate from body effects.
; Enabled=false disables this trigger profile. StrengthScale: strength multiplier, 0..2 (1.0=normal).
; ResistanceStart=default keeps the profile's resistance position; 0..1 overrides it (0=released, 1=fully pressed).
; Hardware uses discrete position/strength steps, so nearby values may produce the same trigger effect.
; VibrationFrequencyCode=default keeps the built-in trigger-vibration setting; 0..255 overrides its device code, not Hz.
; VibrationFrequencyCode exists only for Fire/Frost/Shock. Code 0 silences trigger-local vibration.
[Trigger.BowDraw]
Enabled=true
StrengthScale=1.0
ResistanceStart=default

[Trigger.WeaponBlock]
Enabled=true
StrengthScale=1.0
ResistanceStart=default

[Trigger.ShieldBlock]
Enabled=true
StrengthScale=1.0
ResistanceStart=default

[Trigger.ShieldHit]
Enabled=true
StrengthScale=1.0
ResistanceStart=default

