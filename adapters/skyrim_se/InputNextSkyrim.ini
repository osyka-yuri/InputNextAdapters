; InputNext Skyrim: body haptics and adaptive triggers.
; Most users only need the six controls below. Built-in effects are ready to use.
; Restart Skyrim after edits. Use true/false for switches and a dot for decimals.
; Omitted settings use their built-in defaults.
; Invalid settings reject this file; the startup log identifies the line and reason.
;
; For individual effects, see InputNextSkyrim.reference.ini (it is not loaded).
; Copy only the profile sections you want to change into this file, below the global controls.
; Each section may appear only once; include only the keys you want to change.
; Walk, run, sneak, and mounted walk/run are off by default; sprint and mounted sprint stay on.

[InputNextSkyrim]
ControllerSlot=0            ; Controller slot: 0..3. Normally 0 with one controller.
TriggerScale=1.0            ; Overall trigger strength: 0..1 (0=off, 1=built-in strength).
RumbleScale=1.0             ; Overall body strength, HD and classic: 0..1 (0=off, 1=built-in strength).
BodyEnabled=true            ; Body effects in the controller grips.
TriggersEnabled=true        ; Adaptive-trigger effects, independent of body effects.
RespectGameVibration=true   ; Follow Skyrim's Vibration option for body effects; triggers stay independent.

[LED]
Enabled=true                ; Enable independent lightbar feedback.
HealthEnabled=true          ; Show health changes; all regeneration and damage count.
StealthEnabled=true         ; Show raw detection while actually sneaking when native data is available.
HealthHoldMs=4000           ; Time since the latest health change, 1..60000 ms; no total display cap.
HealingTransitionMs=200     ; Smooth recovery color changes, 0..1000 ms.
CriticalEnter=0.20          ; Enter critical health at or below this current/max ratio.
CriticalExit=0.25           ; Leave critical priority at or above this ratio.
DetectionHiddenScore=0      ; Nonpositive detection stays blue; raw score, not a probability.
DetectionAlertScore=100     ; Magenta endpoint of the positive detection range.
