; Restart Oblivion after changing this file.
; Omitted keys use defaults. Use true or false for switches and a decimal point for numbers.
; Edit existing keys in place. Invalid or duplicate settings prevent the plugin from loading.

[InputNextOblivion]
ControllerSlot=0            ; InputNext slot, 0 to 3.
RumbleScale=1.0             ; HD and classic rumble strength, 0 to 1.
TriggerScale=1.0            ; Adaptive trigger strength, 0 to 1.
BodyEnabled=true            ; Enable vibration.
TriggersEnabled=true        ; Enable adaptive trigger resistance.
MenuEffectsEnabled=true     ; Allow cues for confirmed menu actions.
AudioHapticsEnabled=true    ; Use the embedded bank and optional matching overrides.

[LED]
Enabled=true
HealthEnabled=true          ; Show recent health changes.
StealthEnabled=true         ; Follow the stealth eye while sneaking.
HealthHoldMs=4000           ; Health indication after an HP change, 1 to 60000 ms.
HealingTransitionMs=200     ; Recovery color transition, 0 to 1000 ms.
CriticalEnter=0.20          ; Enter critical lightbar priority at or below this ratio.
CriticalExit=0.25           ; Leave critical lightbar priority at or above this ratio.

; Copy individual effect sections from InputNextOblivion.reference.ini to tune or enable them.
