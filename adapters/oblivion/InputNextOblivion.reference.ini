; Edit existing keys in InputNextOblivion.ini or copy in the effect sections you want to tune.
; Values below are the defaults. Section names and keys are case-insensitive.
; Use true or false for switches and a decimal point for numbers.
; ControllerSlot accepts 0 to 3. RumbleScale and TriggerScale accept 0 to 1.
; HDScale and ClassicScale accept 0 to 2. DurationScale accepts 0.25 to 2.
; FrequencyHz accepts 20 to 1000 Hz or default to keep the authored carrier.
; Use 0 <= CriticalEnter < CriticalExit <= 1 for lightbar thresholds.

[InputNextOblivion]
ControllerSlot=0
RumbleScale=1.0
TriggerScale=1.0
BodyEnabled=true
TriggersEnabled=true
MenuEffectsEnabled=true
AudioHapticsEnabled=true

[LED]
