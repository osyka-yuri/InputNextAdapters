; InputNext Skyrim LE: body haptics and health lightbar feedback.
; Most users only need the four controls below. Built-in effects are ready to use.
; Restart Skyrim after edits. Use true/false for switches and a dot for decimals.
; Omitted settings use their built-in defaults.
; Invalid settings prevent startup; InputNextSkyrimLE.log reports the error line.
;
; For individual effects, see InputNextSkyrimLE.reference.ini (it is not loaded).
; Copy only the profile sections you want to change into this file, below the global controls.
; Each section may appear only once; include only the keys you want to change.
; Existing body and trigger options remain accepted for compatibility. Trigger effects and
; profiles that need signals unavailable in LE remain inactive.

[InputNextSkyrim]
ControllerSlot=0            ; Controller slot: 0..3. Normally 0 with one controller.
RumbleScale=1.0             ; Overall body strength, HD and classic: 0..1 (0=off, 1=built-in strength).
BodyEnabled=true            ; Body effects in the controller grips.
RespectGameVibration=true   ; Follow Skyrim's Vibration option for body effects.

[LED]
Enabled=true                ; Enable independent lightbar feedback.
HealthEnabled=true          ; Show current HP changes, including regeneration and environment damage.
HealthHoldMs=4000           ; Time since the latest health change, 1..60000 ms; no total display cap.
HealingTransitionMs=200     ; Smooth recovery color changes, 0..1000 ms.
CriticalEnter=0.20          ; Enter critical health at or below this current/max ratio.
CriticalExit=0.25           ; Leave critical priority at or above this ratio.
