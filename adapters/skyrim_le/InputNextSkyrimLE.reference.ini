; InputNext Skyrim LE: supported settings reference. This file is not loaded.
; Copy the settings you need into InputNextSkyrimLE.ini. Each section may appear once.
; Omitted values use built-in defaults. Invalid settings prevent startup.
; Older body and trigger options remain accepted; unsupported effects stay inactive.
; LE has no adaptive-trigger effects. Only supported body profiles are listed below.

[InputNextSkyrim]
ControllerSlot=0            ; Controller slot: 0..3. Normally 0 with one controller.
RumbleScale=1.0             ; Overall body strength, HD and classic: 0..1 (0=off, 1=built-in strength).
BodyEnabled=true            ; Body effects in the controller grips.
AudioHapticsEnabled=true    ; Compiled stock audio profiles and optional bank overrides; false uses synthetic effects.
RespectGameVibration=true   ; Follow Skyrim's Vibration option for body effects.

[LED]
Enabled=true
HealthEnabled=true
HealthHoldMs=4000
HealingTransitionMs=200
CriticalEnter=0.20
CriticalExit=0.25

; Body feedback controls apply to grip output.
; Enabled=false disables this profile. HDScale and ClassicScale adjust each output mode, 0..2.
; Classic fallback is generated by the adapter; HD is preferred when available.
; DurationScale (0.25..2) stretches a transient, including gaps between pulses.
; FrequencyHz=default keeps the built-in HD tone; 20..1000 overrides its frequency.

; Melee swings through the air, grouped by weapon.

[Body.Melee.Unarmed.Swing]
