; Copy this file to InputNextFalloutNewVegas.ini to edit all settings.
; Close the game before changing the active INI.

[General]
Enabled=true
; XInput player slot from 0 to 3.
ControllerSlot=0

[Controls]
; Match the physical trigger bindings in the game. Use none for a button or keyboard binding.
; When both actions share a trigger, AimTrigger takes priority while aiming.
AttackTrigger=right
AimTrigger=left

[Effects]
BodyEnabled=true
TriggersEnabled=true
MenuEffects=true
AudioHapticsEnabled=true
ResourceCues=true
UICues=true
; Enables walking, running, and crouch movement cues outside combat.
; Use their Body sections below to select individual gaits.
GaitCues=false
; Global strength multipliers from 0 to 1.
BodyScale=0.65
TriggerScale=0.65
; Resource thresholds are fractions of their maxima.
CriticalEnter=0.20
CriticalExit=0.25
HealthWarning=0.35
ActionPointWarning=0.15
RadiationWarning=0.50

[Logging]
Diagnostics=false

[LED]
Enabled=true
HealthEnabled=true
; Shows detection in shades from blue to magenta while crouched. Requires JIP LN NVSE.
StealthEnabled=true
RadiationEnabled=true
HealthHoldMs=4000
CriticalEnter=0.20
CriticalExit=0.25

