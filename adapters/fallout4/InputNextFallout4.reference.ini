; Reference only. This file is not loaded by the plugin.
; Copy desired settings into InputNextFallout4.ini, then restart Fallout 4.
;
; General: Slot is 0..3; Enabled controls the adapter.
; Effects: TriggerScale and BodyScale are 0..1. BodyEnabled and TriggersEnabled
; enable their output routes. ResourceCues controls health/AP/critical cues;
; UICues controls VATS entry/exit cues.
; LED: one prioritized lightbar group. HealthHoldMs is 1..60000 (default
; 4000); HealingTransitionMs is 0..1000 (default 200). CriticalEnter and
; CriticalExit are ordered ratios in 0..1. Detection scores are raw engine
; response endpoints, not percentages; defaults -100 and 0 may need tuning.
; RadiationEnabled uses current radiation-source-count change events and stays
; unknown until its first real event after startup/load.
; Logging: Diagnostics enables additional runtime records.
;
; Body profiles: Enabled defaults true except OrdinaryStep. HDScale and
; ClassicScale range 0..2. DurationScale scales the complete cue lifetime from
; 0.25 to 2, anchored to the original event time. FrequencyHz is default or
; 20..1000; it sets the primary HD carrier and proportionally retunes a
; secondary HD tone. It does not affect classic output. Existing output limits
; remain in force.
;
; Trigger profiles: Enabled defaults true. StrengthScale ranges 0..2.
; ResistanceStart is default or 0..1 and overrides held trigger resistance start.
; VibrationFrequencyCode is default or 1..255 and overrides the actual-shot
; vibration device code, not a frequency in Hz.

[General]
Slot=0
Enabled=true

[Effects]
TriggerScale=0.65
BodyScale=0.65
BodyEnabled=true
AudioHapticsEnabled=true    ; Compiled stock audio profiles and optional bank overrides; false uses synthetic effects.
TriggersEnabled=true
ResourceCues=true
UICues=false

[LED]
Enabled=true
HealthEnabled=true
StealthEnabled=true
RadiationEnabled=true
HealthHoldMs=4000
HealingTransitionMs=200
CriticalEnter=0.20
CriticalExit=0.25
DetectionHiddenScore=0
DetectionAlertScore=100

[Logging]
Diagnostics=false

